<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거산리프트 관리자 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #1E3A8A; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #1E3A8A; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background: #999; }
        #dashboard { display: none; }
        .check-group { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🛠️ 관리자 시스템</h2>
        
        <!-- 1. 로그인 폼 -->
        <div id="loginSection">
            <div class="form-group">
                <label>관리자 비밀번호</label>
                <input type="password" id="adminPwd" placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn" onclick="login()">로그인</button>
        </div>

        <!-- 2. 대시보드 (업로드 폼) -->
        <div id="dashboard">
            <p style="text-align: center; color: green; font-weight: bold; margin-bottom: 20px;">로그인 완료 (연속 업로드 가능)</p>
            <div class="form-group">
                <label>설치 현장 (예: 김포 지역 물류센터)</label>
                <input type="text" id="installTitle" required>
            </div>
            <div class="form-group">
                <label>리프트 종류</label>
                <select id="liftType">
                    <option value="산업용 화물 리프트">산업용 화물 리프트</option>
                    <option value="테이블 리프트">테이블 리프트</option>
                    <option value="기타 리프트">기타 리프트</option>
                </select>
            </div>
            <div class="form-group">
                <label>설치 사진 선택</label>
                <input type="file" id="imageInput" accept="image/*">
                <div class="check-group">
                    <input type="checkbox" id="useWatermark" checked>
                    <label for="useWatermark">자동 워터마크 적용 (중앙 투명)</label>
                </div>
            </div>
            
            <button class="btn" id="uploadBtn" onclick="processAndUpload()">사진 업로드 및 저장</button>
            
            <!-- 보이지 않는 Canvas (리사이징 및 워터마크 합성용) -->
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbybx4bybBP8kR4dnpA__hzl-az_9lyEOE46hU-hcalloq7XNT9B6vNfduZF0_o-Zna1/exec";
        const LOGO_URL = "여기에_대표님이_보유하신_투명로고_URL입력"; // 예: 깃허브에 올린 logo.png 주소

        // 페이지 로드 시 세션 스토리지 체크
        window.onload = () => {
            if (sessionStorage.getItem('geosan_admin_token') === 'auth_ok') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        };

        // 로그인 처리
        async function login() {
            const pwd = document.getElementById('adminPwd').value;
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', password: pwd })
            });
            const result = await res.json();
            
            if (result.token === 'auth_ok') {
                sessionStorage.setItem('geosan_admin_token', result.token);
                alert('로그인 성공');
                location.reload();
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
        }

        // 이미지 리사이징, 워터마크 합성 후 업로드
        async function processAndUpload() {
            const file = document.getElementById('imageInput').files[0];
            const title = document.getElementById('installTitle').value;
            const liftType = document.getElementById('liftType').value;
            const useWatermark = document.getElementById('useWatermark').checked;

            if (!file || !title) return alert("현장명과 사진을 모두 입력해주세요.");
            
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "처리 중... 잠시만 기다려주세요";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');

                    // 1. 최대 가로 해상도를 1200px로 제한 (리사이징)
                    const MAX_WIDTH = 1200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round(height *= MAX_WIDTH / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // 2. 워터마크 합성 로직 (체크되었을 경우)
                    if (useWatermark && LOGO_URL) {
                        const logoImg = new Image();
                        logoImg.crossOrigin = "Anonymous"; // CORS 우회용
                        logoImg.onload = async function() {
                            // 로고 크기를 이미지 너비의 30%로 설정
                            const logoWidth = width * 0.3;
                            const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                            
                            // 중앙 배치 좌표
                            const x = (width - logoWidth) / 2;
                            const y = (height - logoHeight) / 2;
                            
                            // 투명도 40% 설정
                            ctx.globalAlpha = 0.4;
                            ctx.drawImage(logoImg, x, y, logoWidth, logoHeight);
                            ctx.globalAlpha = 1.0; // 투명도 원복

                            await sendToServer(canvas.toDataURL("image/jpeg", 0.8), file.name, title, liftType, btn);
                        };
                        logoImg.src = LOGO_URL;
                    } else {
                        sendToServer(canvas.toDataURL("image/jpeg", 0.8), file.name, title, liftType, btn);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // GS 서버로 전송
        async function sendToServer(base64Data, fileName, title, liftType, btn) {
            const payload = {
                action: 'upload',
                token: sessionStorage.getItem('geosan_admin_token'),
                fileData: base64Data,
                fileName: fileName,
                title: title,
                liftType: liftType
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('업로드 완료! 구글 드라이브와 시트에 저장되었습니다.');
                    // 연속 업로드를 위해 파일 입력창만 초기화
                    document.getElementById('imageInput').value = '';
                    document.getElementById('installTitle').value = '';
                } else {
                    alert('오류 발생: ' + result.message);
                }
            } catch (err) {
                alert('업로드 실패. 네트워크를 확인하세요.');
            } finally {
                btn.innerText = "사진 업로드 및 저장";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
